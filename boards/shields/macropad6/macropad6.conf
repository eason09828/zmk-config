# 旋钮（EC11）—— 两个旋钮都要这两行才生效
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 鼠标滚轮支持 —— 旋钮 2 用它来滚动页面（键码 &msc SCRL_UP / SCRL_DOWN）
# 开启后键盘会多出一个「鼠标」身份，Mac 上需要重新配对一次蓝牙
CONFIG_ZMK_POINTING=y

# 闲置后深度睡眠，省电（无线键盘必备）
CONFIG_ZMK_SLEEP=y

# 注意：本文件是 Kconfig 片段，注释只能用 # 开头。
# 千万不要用 /* */ 或 // —— Zephyr 会判定为 malformed line，
# 而 Zephyr 对 Kconfig 警告零容忍，会直接 Aborting、编译失败。
